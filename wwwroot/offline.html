<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e0c08" />
  <title>Offline · GeoConquest</title>
  <link rel="icon" href="/icons/icon-32.png" type="image/png" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0e0c08; color: #f6ead0;
      font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 2rem 1.25rem; box-sizing: border-box; gap: 1rem; }
    img { width: 96px; height: 96px; }
    h1 { color: #f2b24c; letter-spacing: .16em; text-transform: uppercase; font-size: 1.2rem; margin: .5rem 0 0; }
    p { max-width: 28rem; line-height: 1.7; color: #c2ad85; margin: 0; }
    a { display: inline-block; margin-top: .8rem; padding: .7rem 1.4rem; border: 1px solid #3ddc84; color: #3ddc84;
      text-decoration: none; letter-spacing: .14em; text-transform: uppercase; font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>No signal, Commander</h1>
    <p>GeoConquest needs an internet connection: every roll and move is checked by the server so nobody can cheat.
       Your game is saved. Reconnect and carry on where you left off.</p>
    <a href="/">Try again</a>
  </main>
</body>
</html>
